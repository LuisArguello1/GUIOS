name: CI - Verificación de Calidad

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-check:
    name: 🐍 Backend (Django Check)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Instalar dependencias del sistema (Cairo, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Ejecutar Django System Check
        env:
          SECRET_KEY: "ci-secret-key-for-django-check-only"
          DEBUG: "True"
        run: |
          python backend/manage.py check

  frontend-check:
    name: ⚛️ Frontend (ESLint, TypeScript & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias de Node
        run: npm ci

      - name: 🧹 Ejecutar Linter (ESLint)
        run: npm run lint

      - name: 🏗️ Compilar (TypeScript & Vite Build)
        run: npm run build
