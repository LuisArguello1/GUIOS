name: CI Quality Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-check:
    name: Backend Validation (Check, Migrations and Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Cairo, pkg-config)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Django system check
        env:
          SECRET_KEY: "ci-secret-key-for-django-check-only"
          DEBUG: "True"
        run: |
          python backend/manage.py check

      - name: Verify no pending migrations
        env:
          SECRET_KEY: "ci-secret-key-for-django-check-only"
          DEBUG: "True"
        run: |
          python backend/manage.py makemigrations --check --dry-run

      - name: Run backend tests
        env:
          SECRET_KEY: "ci-secret-key-for-django-check-only"
          DEBUG: "True"
        run: |
          python backend/manage.py test

  frontend-check:
    name: Frontend Validation (ESLint, TypeScript and Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Build and Type Check
        run: npm run build
